<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/myall.css">
</head>

<body>
  <div class="container">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">地方美食網</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="#">Something else here</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled">Disabled</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
    <div class="row row-cols-1 row-cols-md-2 g-4 mt-3" id="foodlist">
      <div class="col">
        <div class="card">
          <img src="images/896980a801c8.avif" class="card-img-top" alt="...">
          <div class="card-body">
            <div class="display-6 fw-900 text-end">餐廳名稱</div>
            <div class="h5 text-center">地址:xxxxx</div>
            <p class="card-text text-truncate">This is a longer card with supporting text below as a natural lead-in to
              additional
              content. This content is a little bit longer.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <ul class="nav justify-content-center">
    <li class="nav-item">
      <a class="nav-link disabled fw-900">20261001</a>
    </li>
  </ul>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/jquery-4.0.0.js"></script>
  <script src="js/TravelFood.js"></script>
  <script>
    console.log(food)
    $("#foodlist").empty()
    food.forEach(function (item) {
      const strHTML = `<div class="col">
        <div class="card">
          <img src="${item.PicURL}" class="card-img-top" alt="...">
          <div class="card-body">
            <div class="display-6 fw-900 text-truncate mb-1">${ item.Name}</div><div class="h5 mt-2">Tel:${item.Tel}</div>
            <div class="h5 mt-1">地址:${item.City}${item.Town}${item.Address}</div>
            <p class="card-text text-truncate">${item.HostWords}</p>
          </div>
        </div>
      </div>`;
      $("#foodlist").append(strHTML)
    });
  </script>
</body>

</html>
