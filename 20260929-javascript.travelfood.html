<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 地方美食資料練習</title>
    <link rel="stylesheet" href="CSS/myall.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 1024px;
            margin-top: 50px;
            margin-bottom: 0;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 2px 2px 2px 2px #aad2c3;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
        }

        .demo {
            width: 32%;
            box-shadow: 2px 2px 1px 1px #462c64;
            margin-top: 15px;
            float: left;
            margin-right: 1%;
            word-break: break-all;
        }

        .demo .logo {
            width: 100%;
            height: 200px;
            background-position: center;
        }

        @media screen and (max-width:1024px) {
            .wrapper {
                width: 100%;
                margin: 0;
            }

            .demo {
                width: 48%;
            }
        }
    </style>
</head>

<body>
    <div class="display-1 fw-900 mytitle-01">地方美食餐廳列表</div>
    <div class="wrapper" id="foodlist">
        <!-- <div class="demo">
            <div class="logo bg-img"></div>
            <p class="mytitle-04">店家:xxxx</p>
            <p class="mytitle-04">電話:xxxx</p>
        </div> -->
    </div>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/TravelFood.js"></script>

        food.forEach(function (item) {
            // console.log(item.Name)
            // console.log(item.City)

            $("#foodlist").append('<div class="demo"><div class="logo" style="background-image: url(' + item.PicURL + ')"></div><p class="mytitle-04">店家:' + item.Name + '</p><p class="mytitle-04">電話:' + item.Tel + '</p></div>')
        });
    </script>

</body>

</html>
